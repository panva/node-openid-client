name: Retry

permissions: {}

# Only reruns failed jobs; never checks out or executes code from the triggering run.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - Conformance Checks
      - Test
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: retry
    permissions:
      actions: write # Rerun failed workflow jobs.
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'panva/openid-client' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    steps:
      - run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
