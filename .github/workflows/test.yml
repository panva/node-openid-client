name: Test

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 11 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm clean-install
      - run: npm run build
      - name: Type check the emitted declarations
        run: npm run typecheck:dist
      - name: Type-level regression tests
        run: npm run typecheck:types
      - name: Packaging metadata and type resolution
        run: npm run check:packaging
      - name: Packed artifact contents and runtime
        run: npm run test:dist

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm clean-install
      - run: npm run format-check
      - run: git diff --quiet

  check-docs:
    name: check-docs
    runs-on: ubuntu-latest
    needs:
      - build
      - format
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm clean-install
      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          pandoc-version: latest
      - run: npm run build
      - run: npm run docs-check

  node-versions:
    uses: panva/.github/.github/workflows/node-versions.yml@3faba8af3880247be43547787aedd52780c9f946
    with:
      min: 20

  node:
    name: node (${{ matrix.node-version }}, ${{ matrix.suite }})
    needs:
      - node-versions
      - build
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.node-versions.outputs.matrix) }}
        suite:
          - tap:node
          - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          check-latest: true
      - run: npm clean-install
      - name: Run Test Suite
        run: npm run "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
      - name: Test packed artifact
        if: ${{ matrix.suite == 'test' }}
        run: npm run test:dist
      - name: Upload server logs
        if: ${{ failure() && matrix.suite == 'tap:node' }}
        id: artifact-upload-step
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: server.log
          name: node idx(${{ strategy.job-index }}) server log
          if-no-files-found: warn

  electron:
    name: electron
    needs:
      - build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tap/electron/package-lock.json
      - run: npm clean-install
      - name: Install Electron
        run: npm clean-install --prefix tap/electron
      - name: Run Test Suite
        run: npm run tap:electron
        env:
          ELECTRON_BIN: ${{ github.workspace }}/tap/electron/node_modules/.bin/electron
      - name: Upload server logs
        if: ${{ failure() }}
        id: artifact-upload-step
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: server.log
          name: electron server log
          if-no-files-found: warn

  deno:
    name: deno
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: latest
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm clean-install
      - name: Run Test Suite
        run: npm run tap:deno
      - name: Upload server logs
        if: ${{ failure() }}
        id: artifact-upload-step
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: server.log
          name: deno server log
          if-no-files-found: warn

  workerd:
    name: workerd
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tap/workerd/package-lock.json
      - run: npm clean-install
      - run: npm clean-install --prefix tap/workerd
      - name: Run Test Suite
        run: npm run tap:workerd
        env:
          WORKERD_BIN: ${{ github.workspace }}/tap/workerd/node_modules/.bin/workerd
          WORKERD_MODULE: ${{ github.workspace }}/tap/workerd/node_modules/workerd

  bun:
    name: bun
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm clean-install
      - name: Run Test Suite
        run: npm run tap:bun
      - name: Upload server logs
        if: ${{ failure() }}
        id: artifact-upload-step
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: server.log
          name: bun server log
          if-no-files-found: warn

  browsers:
    name: browsers (${{ matrix.browser }})
    needs:
      - build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - safari
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm clean-install
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: ./node_modules/.bin/playwright install --only-shell chromium firefox webkit
      - name: Run Test Suite
        run: npm run tap:browsers
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload server logs
        if: ${{ failure() }}
        id: artifact-upload-step
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: server.log
          name: ${{ matrix.browser }} server log
          if-no-files-found: warn
